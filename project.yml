name: DJ1H
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "27.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    PRODUCT_NAME: DJ1H
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_LANGUAGE: zh-Hans
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
configs:
  Debug: debug
  Staging: debug
  Release: release
targets:
  DJ1H:
    type: application
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - path: DJ1H
        excludes:
          - "Resources"
          - "SupportingFiles"
      - path: DJ1H/Resources
        buildPhase: resources
    info:
      path: DJ1H/SupportingFiles/Info.plist
      properties:
        CFBundleDisplayName: DJ1H
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: 连接局域网内的 VoHive 服务器，以读取 DJI 4G 模块状态并收发短信。
        ServerBaseURL: $(SERVER_BASE_URL)
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.devicehub
        CODE_SIGN_ENTITLEMENTS: DJ1H/SupportingFiles/DJ1H.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_STRICT_CONCURRENCY: complete
      configs:
        Debug:
          base:
            SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    configFiles:
      Debug: DJ1H/SupportingFiles/Debug.xcconfig
      Staging: DJ1H/SupportingFiles/Staging.xcconfig
      Release: DJ1H/SupportingFiles/Release.xcconfig
    scheme:
      testTargets:
        - DJ1HTests
        - DJ1HUITests
  DJ1HTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - path: DJ1HTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: DJ1H
  DJ1HUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - path: DJ1HUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: DJ1H
